# CreditIQ lending policy. Policies are versioned, reviewed documents, separate from the model.
# Outcomes are "within threshold" or "flagged for review" — never approve/deny.
# Rules may only use model inputs, never sensitive attributes (enforced on load).
version: "2026.10.1"
name: Baseline review policy
description: >
  Uses the model's validation-chosen PD threshold, a stricter threshold for revolving loans,
  an affordability rule and a missing-bureau-data rule.
pd_threshold:
  default: model                 # the threshold chosen on the validation split at training time
  segments:
    - column: NAME_CONTRACT_TYPE
      value: Revolving loans
      threshold: 0.12
band_cutoffs: [0.05, 0.10, 0.20]
band_labels: [Low, Moderate, Elevated, High]
hard_rules:
  - id: annuity_to_income
    type: ratio_limit
    numerator: AMT_ANNUITY
    denominator: AMT_INCOME_TOTAL
    max: 0.45
    action: flag
    reason: Instalment above 45% of declared income (affordability check)
  - id: missing_bureau_enquiries
    type: missing_value
    column: AMT_REQ_CREDIT_BUREAU_YEAR
    action: note
    reason: No credit-bureau enquiry record; the model imputes it, a reviewer may want to verify
cost_matrix:
  mode: per_loan                 # missed default costs LGD × EAD; flagging a good applicant costs margin × EAD
  lost_margin_rate: 0.08
  review_cost: 500
economics:
  lgd: 0.45
  ccf: 1.0
  annual_rate: 0.16
  funding_rate: 0.07
  opex_per_loan: 1500
  horizon_years: 1
