# Bundled SYNTHETIC demo data (20,000 fabricated applications). Results describe fabricated data only.
name: synthetic-demo
description: Three models on the bundled synthetic sample; the validation-selected model is registered.
dataset:
  path: data/sample_credit_data.csv
  kind: synthetic
target:
  column: TARGET
  default_values: [1]        # required: CreditIQ never assumes 1 = default
  non_default_values: [0]
columns:
  exclude: [SK_ID_CURR]      # identifier (also auto-detected)
  date: APPLICATION_DATE     # enables the chronological split; not a predictor
  exposure: AMT_CREDIT
  sensitive: [CODE_GENDER, DAYS_BIRTH, NAME_FAMILY_STATUS]   # audit only, never model inputs
split:
  strategy: stratified
  validation: 0.2
  test: 0.2
sample_size: 60000
models: [logreg, random_forest, gbm]
gbm_backend: lightgbm
calibration: sigmoid           # fitted on validation only
threshold:
  rule: max_f1                 # chosen on validation only
selection_metric: roc_auc      # model selection on validation
leakage_guard:
  enabled: true                # screens TRAINING rows only; removes POST_LOAN_COLLECTION_CALLS
  auc_threshold: 0.90
seed: 42
registry:
  model_name: creditiq-pd
  alias: staging
