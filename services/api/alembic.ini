# Alembic CLI config: `uv run alembic -c services/api/alembic.ini upgrade head` (uses DATABASE_URL).
[alembic]
script_location = %(here)s/src/creditiq_api/migrations

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
