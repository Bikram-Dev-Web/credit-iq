[project]
name = "creditiq-api"
version = "2.0.0.dev0"
description = "CreditIQ scoring, decision, portfolio and monitoring API (FastAPI)."
requires-python = ">=3.11"
dependencies = [
    "creditiq-core[boosting,shap]",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "mlflow>=2.16",
    "pyyaml>=6.0",
    "prometheus-client>=0.20",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.9",
]

[project.scripts]
creditiq-api = "creditiq_api.main:run"

[tool.uv.sources]
creditiq-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/creditiq_api"]
