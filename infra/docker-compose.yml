# CreditIQ v2 — the whole stack on one machine:  docker compose up  (from the repo root)
#
#   web :3000 → api :8000 → postgres        trainer-seed → mlflow :5000 → api
#   monitor (hourly drift job) → postgres    prometheus :9090 → grafana :3001
#
# First start trains the synthetic model, registers it in MLflow, promotes it to production and seeds demo
# traffic (about 3–5 minutes). Secrets below are development defaults; override them in a .env file.
name: creditiq

x-python: &python
  build:
    context: ..
    dockerfile: infra/docker/python.Dockerfile
  image: creditiq-python:local
  environment: &python-env
    ENVIRONMENT: docker
    DATABASE_URL: postgresql+psycopg://creditiq:${POSTGRES_PASSWORD:-creditiq-dev}@postgres:5432/creditiq
    REGISTRY_BACKEND: mlflow
    MLFLOW_TRACKING_URI: http://mlflow:5000
    MODEL_NAME: creditiq-pd
    MODEL_ALIAS: production
    AUDIT_HASH_KEY: ${AUDIT_HASH_KEY:-dev-only-audit-key-change-me}
    API_KEYS: analyst:${ANALYST_KEY:-dev-analyst-key-change-me},admin:${ADMIN_KEY:-dev-admin-key-change-me}
    LOG_JSON: "true"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: creditiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-creditiq-dev}
      POSTGRES_DB: creditiq
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creditiq -d creditiq"]
      interval: 5s
      retries: 20
    deploy: { resources: { limits: { memory: 384m } } }

  mlflow:
    <<: *python
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql+psycopg://creditiq:${POSTGRES_PASSWORD:-creditiq-dev}@postgres:5432/mlflow
      --artifacts-destination /mlartifacts --serve-artifacts
      --allowed-hosts "mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000"
    user: root
    volumes:
      - mlartifacts:/mlartifacts
    ports: ["5000:5000"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health || exit 1"]
      interval: 10s
      retries: 30
      start_period: 20s
    deploy: { resources: { limits: { memory: 768m } } }

  trainer-seed:
    <<: *python
    # Train once on first start: the full synthetic model → production, a CI-sized model → staging.
    command: >
      sh -c "creditiq-train versions | grep -q '\"version\"' && echo 'registry already seeded' && exit 0;
             creditiq-train train --config services/trainer/configs/synthetic.yaml --alias production &&
             creditiq-train train --config services/trainer/configs/synthetic_ci.yaml --alias staging"
    environment:
      <<: *python-env
    restart: "no"
    depends_on:
      mlflow: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 2g } } }

  api:
    <<: *python
    command: ["creditiq-api"]
    environment:
      <<: *python-env
      GRAFANA_URL: http://localhost:3001/d/creditiq-overview
      MLFLOW_UI_URL: http://localhost:5000
      REGISTRY_POLL_SECONDS: "15"
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    volumes:
      - modelcache:/app/storage
    depends_on:
      postgres: { condition: service_healthy }
      trainer-seed: { condition: service_completed_successfully }
    deploy: { resources: { limits: { memory: 1g } } }

  seed:
    <<: *python
    command: ["python", "scripts/seed_demo.py", "--api", "http://api:8000", "--key", "${ADMIN_KEY:-dev-admin-key-change-me}"]
    restart: "no"
    depends_on:
      api: { condition: service_healthy }

  monitor:
    <<: *python
    command: ["creditiq-monitor", "schedule", "--every", "3600"]
    environment:
      <<: *python-env
      MONITOR_INBOX: /app/storage/inbox
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes:
      - inbox:/app/storage/inbox
    healthcheck: { disable: true }
    depends_on:
      api: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 768m } } }

  web:
    build: { context: ../web }
    image: creditiq-web:local
    environment:
      CREDITIQ_API_URL: http://api:8000
      CREDITIQ_ANALYST_KEY: ${ANALYST_KEY:-dev-analyst-key-change-me}
      CREDITIQ_ADMIN_KEY: ${ADMIN_KEY:-dev-admin-key-change-me}
      NEXT_PUBLIC_ENVIRONMENT: docker
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 384m } } }

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    deploy: { resources: { limits: { memory: 256m } } }

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-creditiq-dev}
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/creditiq-overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]
    deploy: { resources: { limits: { memory: 256m } } }

volumes:
  pgdata:
  mlartifacts:
  modelcache:
  inbox:
