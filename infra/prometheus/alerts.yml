groups:
  - name: creditiq
    rules:
      - alert: CreditIQHighLatencyP95
        expr: histogram_quantile(0.95, sum by (le) (rate(creditiq_http_request_duration_seconds_bucket{route="/v1/score"}[5m]))) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "p95 /v1/score latency above 50 ms" }
      - alert: CreditIQErrors
        expr: sum(rate(creditiq_http_errors_total[5m])) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "API 5xx/exception rate above 0.05/s" }
      - alert: CreditIQDrift
        expr: max(creditiq_drift_status) >= 1
        labels: { severity: warning }
        annotations: { summary: "Latest monitoring run reported drift" }
      - alert: CreditIQFlagRateShift
        expr: (sum(rate(creditiq_decisions_total{outcome="flagged_for_review"}[1h])) / sum(rate(creditiq_decisions_total[1h]))) > 0.5
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "More than half of scored applicants flagged for review over the last hour" }
