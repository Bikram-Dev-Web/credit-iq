[project]
name = "creditiq-core"
version = "2.0.0.dev0"
description = "CreditIQ core: data validation, features, PD models, calibration, evaluation, finance, fairness and monitoring. Pure Python, no I/O."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
boosting = ["lightgbm>=4.0"]
shap = ["shap>=0.44"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/creditiq_core"]
